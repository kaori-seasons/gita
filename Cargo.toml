[workspace]
members = [
    ".",
    "rust-edge-compute-core",
    "rust-edge-compute-cpp",
    "rust-edge-compute-ml",
    "rust-edge-compute-python",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Edge Compute Team"]
license = "MIT"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"

# Web框架
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# HTTP客户端
reqwest = { version = "0.11", features = ["json"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 跨语言互操佟
cxx = "1.0"

# 容器管理
oci-spec = "0.6"
tokio-process = "0.2"

# 配置管理
config = "0.14"
dotenvy = "0.15"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 工具库
uuid = { version = "1.0", features = ["v4", "serde"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
fastrand = "2.0"
lazy_static = "1.4"

# 数据库
sled = { version = "0.34", default-features = true }
bincode = "1.3"

# 异步特质
async-trait = "0.1"

# 加密和安全
ring = "0.17"
base64 = "0.21"
rustls = "0.21"
rustls-pemfile = "1.0"
tokio-rustls = "0.24"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"

# 审计和监控
opentelemetry = "0.20"
opentelemetry-jaeger = "0.19"
tracing-opentelemetry = "0.21"

[package]
name = "rust-edge-compute"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "基于Rust的边缘计算框架"

[dependencies]
# 异步运行时
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"

# Web框架
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# HTTP客户端
reqwest = { version = "0.11", features = ["json"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 跨语言互操作
cxx = "1.0"

# Cap'n Proto serialization
capnp = { version = "0.18", optional = true }

# 容器管理
oci-spec = "0.6"

# 系统调用
libc = "0.2"

# 容器运行时
tokio-process = "0.2"

# 配置管理
config = "0.14"
dotenvy = "0.15"

# 日志
tracing = "0.1.43"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Tokio监控和调试
console-subscriber = { version = "0.3", optional = true }
tokio-metrics = { version = "0.4", optional = true }

# 工具库
uuid = { version = "1.0", features = ["v4", "serde"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
fastrand = "2.0"
lazy_static = "1.4"

# 数据库
sled = { version = "0.34", default-features = true }
bincode = "1.3"

# 异步特质
async-trait = "0.1"

# 加密和安全
ring = "0.17"
base64 = "0.21"
rustls = "0.21"
rustls-pemfile = "1.0"
tokio-rustls = "0.24"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"

# 审计和监控
opentelemetry = "0.20"
opentelemetry-jaeger = "0.19"
tracing-opentelemetry = "0.21"

[dev-dependencies]
# 测试依赖
reqwest = { version = "0.11", features = ["json"] }
tokio-test = "0.4"
tokio-console = "0.1"


[build-dependencies]
cxx-build = "1.0"
capnpc = { version = "0.18", optional = true }

[lib]
name = "rust_edge_compute"
path = "src/lib.rs"

[[bin]]
name = "rust-edge-compute"
path = "src/main.rs"

[features]
default = []
cxx = []
capnproto = ["dep:capnp", "dep:capnpc"]
tokio-console = ["dep:console-subscriber"]
tokio-metrics = ["dep:tokio-metrics"]
monitoring = ["tokio-console", "tokio-metrics"]

# libcontainer仅在Linux上可用
[target.'cfg(target_os = "linux")'.dependencies]
libcontainer = { git = "https://github.com/containers/youki.git", branch = "main" }
