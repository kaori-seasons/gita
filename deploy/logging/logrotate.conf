# logrotate Configuration for Rust Edge Compute Framework
# File: /etc/logrotate.d/edge-compute
# Manages log rotation and archiving

/var/log/edge-compute/*.log {
    # Rotate daily
    daily
    
    # Keep 30 days of logs
    rotate 30
    
    # Compress old logs
    compress
    
    # Delay compression to the next rotation
    delaycompress
    
    # Don't error if log file is missing
    missingok
    
    # Don't rotate empty files
    notifempty
    
    # Create new file with same permissions as old
    create 0640 edge-compute edge-compute
    
    # Use date extension for old files
    dateext
    dateformat -%Y%m%d
    
    # Post-rotation script to restart logging
    postrotate
        systemctl reload rsyslog > /dev/null 2>&1 || true
        systemctl reload-or-restart rust-edge-compute > /dev/null 2>&1 || true
    endscript
    
    # Force this configuration
    sharedscripts
}

# Separate configuration for monitor logs (if created)
/var/log/edge-compute/monitor.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 edge-compute edge-compute
    dateext
    dateformat -%Y%m%d
}

# Archive old logs
/opt/edge-compute/backups/*.log {
    yearly
    rotate 5
    compress
    missingok
    notifempty
    create 0640 edge-compute edge-compute
}
