# rsyslog Configuration for Rust Edge Compute Framework
# File: /etc/rsyslog.d/30-edge-compute.conf
# This configuration aggregates logs from the edge-compute service

# Define input source for edge-compute
:programname, isequal, "edge-compute" /var/log/edge-compute/app.log
& stop

# Log rotation settings (handled by systemd journal)
# For legacy syslog backup, uncomment below:

# Optional: Forward critical errors to a different file
:programname, isequal, "edge-compute" /var/log/edge-compute/error.log
& stop

# Optional: Send remote syslog to centralized logging server
# Uncomment and configure your remote syslog server:
# :programname, isequal, "edge-compute" @@remote-host.example.com:514

# Optional: Alert on critical errors
# :programname, isequal, "edge-compute" |/usr/local/bin/critical-error-handler.sh

# Ensure proper file permissions
$FileOwner edge-compute
$FileGroup edge-compute
$FileCreateMode 0640
$DirCreateMode 0750
$Umask 0027

# Flush to disk immediately for error logs
$ActionFileDefaultTemplate RSYSLOG_FORMAT
$ActionFileEnableSync on
