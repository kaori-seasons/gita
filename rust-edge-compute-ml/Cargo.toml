[package]
name = "rust-edge-compute-ml"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Rust Edge Compute Framework - Candle ML Executor"

[lib]
name = "rust_edge_compute_ml"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 核心库
 rust-edge-compute-core = { path = "../rust-edge-compute-core", features = ["candle"] }

# Candle核心库（使用外部依赖）
# Note: Disable default-features to prevent objc2 on Linux, but keep CPU backend
candle-core = { version = "0.9.2-alpha.1", default-features = false }
candle-nn = { version = "0.9.2-alpha.1", default-features = false }
candle-transformers = { version = "0.9.2-alpha.1", default-features = false }

# 异步运行时
tokio = { workspace = true }

# 异步trait支持
async-trait = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }

# 日志
tracing = { workspace = true }

# 工具库
uuid = { workspace = true }
base64 = "0.21"

[features]
default = []
# CUDA支持
cuda = ["candle-core/cuda", "candle-nn/cuda"]
# cuDNN支持
cudnn = ["cuda", "candle-core/cudnn"]
# MKL优化
mkl = ["candle-core/mkl"]
# Accelerate优化（macOS专用）
accelerate = ["candle-core/accelerate"]
# Metal支持（仅macOS）- 包含objc2依赖
metal = ["candle-core/metal"]